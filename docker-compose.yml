services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: career_user
      POSTGRES_PASSWORD: career_pass
      POSTGRES_DB: career_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career_user -d career_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://career_user:career_pass@db:5432/career_platform
      SECRET_KEY: ${SECRET_KEY:-change_me_in_production}
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      DEBUG: "false"
    volumes:
      - resume_uploads:/app/uploads
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_BASE_URL: http://api:8000/api/v1
    ports:
      - "8501:8501"

volumes:
  postgres_data:
  resume_uploads:
